services:
  - type: web
    name: suiteframe-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set in the Render dashboard (G-XXXXXXXXXX). Left empty in git.
      - key: GA_MEASUREMENT_ID
        sync: false
      # Web3Forms access key (https://web3forms.com). Left empty in git.
      - key: FORM_ACCESS_KEY
        sync: false
    headers:
      # Security / hygiene
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Fonts are versioned by filename: cache for a year.
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Images / brand files keep stable names: cache a week, then revalidate.
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/brand/*
        name: Cache-Control
        value: public, max-age=604800
      # CSS / JS are not fingerprinted — revalidate on every request.
      - path: /assets/styles.css
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/consent.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/track.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/form.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
